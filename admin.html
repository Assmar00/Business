<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSMAR00 // GOD-MODE CONTROL PANEL</title>
    <style>
        :root {
            --accent-color: #8a2be2;
            --accent-hover: #9d3bf0;
            --accent-glow: rgba(138, 43, 226, 0.3);
            --bg-gradient: radial-gradient(circle at 50% 0%, #0d0b18 0%, #040407 100%);
            --card-bg: #090812;
            --card-border: #171429;
            --input-bg: #110f1d;
            --input-border: #221d3a;
            --text-main: #e2e2ee;
            --text-muted: #777799;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body { 
            background: var(--bg-gradient);
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
        }

        /* LOGIN OVERLAY */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 7, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(12px);
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            padding: 40px;
            width: 360px;
            text-align: center;
        }

        .login-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; color: var(--accent-color); letter-spacing: 2px; }
        .login-card input {
            width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
            color: var(--accent-color); padding: 12px 16px; border-radius: 8px; font-size: 13px;
            margin-bottom: 15px; outline: none; text-align: center;
        }

        .login-card button {
            width: 100%; background: var(--accent-color); color: #ffffff; border: none; padding: 12px;
            font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 13px; text-transform: uppercase;
        }

        #login-error { color: #ff4455; font-size: 11px; margin-top: 12px; font-family: monospace; font-weight: bold; }

        /* HAUPT CONTAINER */
        #app-container { display: none; height: 100vh; display: flex; }

        sidebar { 
            width: 280px; background: rgba(7, 6, 12, 0.85); border-right: 1px solid var(--card-border); 
            display: flex; flex-direction: column; padding: 22px 16px; overflow-y: auto; 
        }

        .logo { font-size: 18px; font-weight: 900; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-color); padding-left: 8px; }
        .nav-btn { 
            background: transparent; border: 1px solid transparent; color: #777799; text-align: left; 
            padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; 
            margin-bottom: 4px; width: 100%; 
        }
        .nav-btn:hover, .nav-btn.active { background: var(--input-bg); color: var(--accent-color); border-color: var(--input-border); }

        main { flex: 1; padding: 30px; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; margin-bottom: 22px; }
        h1 { font-size: 18px; font-weight: 700; text-transform: uppercase; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .card h2 { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }

        input, textarea { 
            width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); 
            color: var(--accent-color); padding: 9px 12px; border-radius: 6px; font-size: 12px; 
            margin-bottom: 12px; outline: none; 
        }

        button { background: var(--accent-color); color: #ffffff; border: none; padding: 9px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 12px; }
        button:hover { background: var(--accent-hover); }

        .chat-box {
            background: #04030a; border: 1px solid var(--card-border); border-radius: 8px; height: 220px;
            overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
        }
        .chat-msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 11px; font-family: monospace; }
        .msg-user { background: #1a1829; align-self: flex-start; border: 1px solid #2d2948; color: #ddd; }
        .msg-admin { background: var(--accent-color); color: #fff; align-self: flex-end; font-weight: bold; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>ASSMAR00</h2>
            <p style="font-size: 11px; color: #666688; margin-bottom: 25px;">Eingeschränkter Admin-Zugriff</p>
            <input type="password" id="pass-input" placeholder="Passwort eingeben...">
            <button onclick="checkLogin()">Zugriff Gewähren</button>
            <div id="login-error"></div>
        </div>
    </div>

    <!-- MAIN PANEL CONTAINER -->
    <div id="app-container">
        <sidebar>
            <div class="logo">ASSMAR00</div>
            <button class="nav-btn active" onclick="switchTab('tickets', this)">🎫 Live Nachrichten & Support</button>
        </sidebar>

        <main>
            <header>
                <h1>Admin Control Center</h1>
            </header>

            <!-- CHAT / NACHRICHTEN TAB -->
            <div id="tickets" class="tab-content active">
                <div class="card">
                    <h2>Live-Nachricht an Client senden (Pop-up)</h2>
                    
                    <div style="margin-bottom: 12px; font-size: 11px; font-family: monospace;">
                        <div><strong>Ziel-Desktop (Hostname):</strong> <input type="text" id="target-desktop" value="ASSMAR-PC" style="margin-top: 5px;"></div>
                    </div>

                    <label>Live-Chat / Nachricht an den Loader des Users:</label>
                    <div class="chat-box" id="chat-messages">
                        <div class="chat-msg msg-admin"><strong>System: Bereit für Nachrichten...</strong></div>
                    </div>

                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="chat-input" placeholder="Nachricht in den Loader senden..." style="margin-bottom: 0;">
                        <button onclick="sendChatMessage()">Senden</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const RENDER_URL = "https://ai-bot-1-zu9n.onrender.com";

        function checkLogin() {
            const pass = document.getElementById('pass-input').value.trim();
            const err = document.getElementById('login-error');

            if (pass === "Assmar00.550662.-?") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
            } else {
                err.innerText = "ACCESS DENIED: Falsches Passwort!";
                document.getElementById('pass-input').value = "";
            }
        }

        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && document.getElementById('login-overlay').style.display !== 'none') {
                checkLogin();
            }
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const msgText = input.value.trim();
            const targetDesktop = document.getElementById('target-desktop').value.trim();
            
            if(!msgText || !targetDesktop) return;

            fetch(`${RENDER_URL}/api/admin/send_message`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ desktop: targetDesktop, message: msgText })
            })
            .then(res => res.json())
            .then(data => {
                const chatBox = document.getElementById('chat-messages');
                const newMsg = document.createElement('div');
                newMsg.className = "chat-msg msg-admin";
                newMsg.innerHTML = `<strong>Admin (an ${targetDesktop}):</strong> ` + msgText;
                chatBox.appendChild(newMsg);

                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(err => {
                alert("Fehler beim Senden der Nachricht an den Server!");
                console.error(err);
            });
        }
    </script>
</body>
</html>
